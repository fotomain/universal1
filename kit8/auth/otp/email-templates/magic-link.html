<!-- Supabase > Authentication > Emails > "Magic Link"  (sent to EXISTING users)
     Subject: Your sign-in code: {{ .Token }} -->
<h2>Your sign-in code</h2>
<p>Enter this code in the app to sign in:</p>
<p style="font-size:32px;font-weight:bold;letter-spacing:6px;font-family:monospace;margin:16px 0">{{ .Token }}</p>
<p>The code expires soon. If you didn't request it, ignore this email.</p>
<p style="color:#666;font-size:13px">On the web you can also <a href="{{ .ConfirmationURL }}">sign in with this link</a>.</p>
