<!-- Supabase > Authentication > Emails > "Reset Password"
     Subject: Your password reset code: {{ .Token }} -->
<h2>Reset your password</h2>
<p>Enter this code in the app, then choose a new password:</p>
<p style="font-size:32px;font-weight:bold;letter-spacing:6px;font-family:monospace;margin:16px 0">{{ .Token }}</p>
<p>Or <a href="{{ .ConfirmationURL }}">open this link to set a new password</a>.</p>
<p>The code and link expire soon. If you didn't ask to reset your password, ignore this email - your password stays the same.</p>
