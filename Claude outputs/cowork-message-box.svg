<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" font-family="-apple-system, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="760" height="420" fill="#f5f4ef"/>
  <!-- window chrome -->
  <rect x="20" y="20" width="720" height="380" rx="12" fill="#faf9f5" stroke="#d8d5cc"/>
  <circle cx="42" cy="40" r="6" fill="#ff5f57"/><circle cx="62" cy="40" r="6" fill="#febc2e"/><circle cx="82" cy="40" r="6" fill="#28c840"/>
  <text x="380" y="45" text-anchor="middle" font-size="13" fill="#777">Claude</text>
  <text x="380" y="150" text-anchor="middle" font-size="26" fill="#3d3929">How can I help you today?</text>

  <!-- message box -->
  <rect x="110" y="200" width="540" height="120" rx="16" fill="#fff" stroke="#cfccc2" stroke-width="1.5"/>
  <text x="134" y="236" font-size="15" fill="#a3a09a">Describe your task…</text>

  <!-- bottom-left controls -->
  <rect x="128" y="276" width="30" height="28" rx="8" fill="#fff" stroke="#d8d5cc"/>
  <text x="143" y="295" text-anchor="middle" font-size="16" fill="#555">+</text>
  <rect x="168" y="276" width="96" height="28" rx="8" fill="#fdf1ea" stroke="#d97757" stroke-width="2"/>
  <text x="216" y="295" text-anchor="middle" font-size="14" font-weight="600" fill="#c15f3c">Cowork</text>

  <!-- send button -->
  <rect x="606" y="276" width="30" height="28" rx="8" fill="#d97757"/>
  <text x="621" y="295" text-anchor="middle" font-size="15" fill="#fff">↑</text>

  <!-- callout -->
  <path d="M216 340 L216 312" stroke="#c15f3c" stroke-width="2" marker-end="url(#a)"/>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#c15f3c"/></marker></defs>
  <text x="216" y="360" text-anchor="middle" font-size="14" font-weight="600" fill="#c15f3c">Click "Cowork" here</text>
  <text x="380" y="392" text-anchor="middle" font-size="11" fill="#888">Simplified illustration — the real app may look slightly different</text>
</svg>
